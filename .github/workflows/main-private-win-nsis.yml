# Windows-only private release pipeline for main_private.
# This repository's Allowed actions policy rejects `uses:` steps, so this
# workflow intentionally uses only commands already available on the hosted
# Windows runner. A PR into main_private builds only; changing the release
# trigger file on main_private builds and publishes the prerelease.

name: main-private-win-nsis

on:
  push:
    branches: [ main_private ]
    paths:
      - '.github/private-release-trigger'
  pull_request:
    branches: [ main_private ]

concurrency:
  group: main-private-win-nsis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows NSIS
    runs-on: windows-2022

    steps:
      - name: Clone source without checkout action
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $branch = $env:GITHUB_HEAD_REF
          } else {
            $branch = $env:GITHUB_REF_NAME
          }
          Write-Host "Cloning branch: $branch"
          git clone --depth 1 --branch "$branch" "https://github.com/${{ github.repository }}.git" source
          git -C source rev-parse HEAD

      - name: Show preinstalled toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          python --version
          git --version
          gh --version

      - name: Configure npm and install Yarn
        shell: pwsh
        run: |
          npm config set legacy-peer-deps true
          npm install -g yarn

      - name: Install project dependencies
        shell: pwsh
        working-directory: source
        run: npm i

      - name: Build application assets
        shell: pwsh
        working-directory: source
        run: npm run b

      - name: Prepare electron-builder config
        shell: pwsh
        working-directory: source
        run: npm run pb

      - name: Build Windows x64 NSIS installer
        shell: pwsh
        working-directory: source
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          WORKFLOW_NAME: private-windows
        run: |
          node build/bin/build-win-nsis-private
          $asset = Get-ChildItem -Path dist -Filter '*win-x64-installer.exe' | Select-Object -First 1
          if (-not $asset) {
            throw 'Windows x64 NSIS installer was not produced'
          }
          Write-Host "Built installer: $($asset.FullName)"

      - name: Publish Windows-only prerelease
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $tag = "private-v$version-win10plus-r${{ github.run_number }}"
          $asset = Get-ChildItem -Path dist -Filter '*win-x64-installer.exe' | Select-Object -First 1
          if (-not $asset) {
            throw 'Windows x64 NSIS installer not found in dist/'
          }

          gh release create $tag $asset.FullName `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "electerm $version Private - Windows 10+ x64" `
            --notes "Windows-only private build from main_private. Includes enterprise SSH/SFTP safety changes and disabled application update checks." `
            --prerelease
