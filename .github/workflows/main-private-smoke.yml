name: main-private-smoke

on:
  pull_request:
    branches: [ main_private ]

jobs:
  smoke:
    name: Windows runner and setup actions smoke test
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - run: echo "windows-runner-and-setup-actions-started"
