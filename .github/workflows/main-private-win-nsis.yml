# Private branch Windows release workflow.
# Build steps intentionally mirror upstream .github/workflows/win-nsis.yml.

name: main-private-win-nsis

on:
  push:
    branches: [ main_private ]

permissions:
  contents: write

jobs:
  build:

    runs-on: windows-2022
    environment: build
    if: ${{ contains(github.event.head_commit.message, '[private release]') && !contains(github.event.head_commit.message, '[skip build]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip win]') && !contains(github.event.head_commit.message, '[skip nsis]') }}

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - uses: actions/setup-python@v5
      with:
        python-version: '3.7'
        architecture: 'x64'
    - run: npm config set legacy-peer-deps true
    - run: npm install -g node-gyp

    - run: npm install -g yarn
    - run: npm un node-pty serialport
    - run: npm i
    - run: npm i -S -E node-pty@1.1.0-beta14
    - run: npm i -S -E serialport@13.0.0

    - name: Install R2 dependencies if needed
      if: ${{ contains(github.event.head_commit.message, '[r2]') }}
      run: npm i -D @aws-sdk/client-s3

    - run: npm run b

    - name: Run pb
      run: npm run pb

    - name: build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUILD_NUMBER: ${{ secrets.BUILD_NUMBER }}
        WORKFLOW_NAME: ${{ github.workflow }}
        CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
        CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

      run: node build/bin/build-win-nsis

    - name: Publish private Windows release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $pkg = Get-Content package.json -Raw | ConvertFrom-Json
        $version = $pkg.version
        $tag = "private-v$version-win10plus-r${{ github.run_number }}"
        $asset = Get-ChildItem -Path dist -Filter "*win-x64-installer.exe" | Select-Object -First 1

        if (-not $asset) {
          throw "Windows x64 NSIS installer not found in dist/"
        }

        gh release create $tag $asset.FullName `
          --target "${{ github.sha }}" `
          --title "electerm $version Private - Windows 10+ x64" `
          --notes "Windows-only private build from main_private. Includes the enterprise SSH/SFTP safety changes and disabled application update checks." `
          --prerelease

        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
