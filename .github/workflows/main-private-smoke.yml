name: main-private-smoke

on:
  pull_request:
    branches: [ main_private ]

jobs:
  smoke:
    name: Query latest private Windows push run
    runs-on: windows-2022
    steps:
      - name: Query workflow runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/main-private-win-nsis.yml/runs?branch=main_private&event=push&per_page=10" `
            --jq '.workflow_runs[] | [.id,.run_number,.status,.conclusion,.head_sha,.html_url] | @tsv'
