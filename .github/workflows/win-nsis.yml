name: Private Windows 10+ Release

on:
  push:
    branches: [ main_private ]

permissions:
  contents: write

concurrency:
  group: private-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, '[private release]') }}
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install build dependencies
        shell: pwsh
        run: |
          npm config set legacy-peer-deps true
          npm install -g node-gyp yarn
          npm uninstall node-pty serialport
          npm install
          npm install -S -E node-pty@1.1.0-beta14
          npm install -S -E serialport@13.0.0

      - name: Build application assets
        run: npm run b

      - name: Prepare electron-builder config
        run: npm run pb

      - name: Build Windows 10+ x64 NSIS installer
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          WORKFLOW_NAME: private-windows
        run: node build/bin/build-win-nsis.js

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: electerm-private-windows-x64
          path: dist/*win-x64-installer.exe
          if-no-files-found: error

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $tag = "private-v$version-win10plus"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish Windows-only private release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem -Path dist -Recurse -Filter "*win-x64-installer.exe" | Select-Object -First 1
          if (-not $asset) {
            throw "Windows x64 installer was not found under dist/"
          }

          $notes = @"
          Private Windows-only build from the main_private branch.

          Supported platform:
          - Windows 10 and Windows 11
          - x64 only

          Private-build changes:
          - Remote SFTP no longer enumerates /etc/passwd or /etc/group.
          - SSH authentication failures do not auto-retry unless explicitly enabled.
          - Application update checks are disabled.

          This release intentionally contains no Linux, macOS, Windows 7, ARM64, APPX, portable, or tar packages.
          "@
          $notes | Set-Content -Path release-notes.md -Encoding utf8

          $releaseTags = gh release list --limit 100 --json tagName --jq ".[].tagName"
          $releaseExists = $releaseTags | Where-Object { $_ -eq $env:RELEASE_TAG }
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $asset.FullName --clobber
            gh release edit $env:RELEASE_TAG `
              --title "electerm $env:APP_VERSION Private - Windows 10+ x64" `
              --notes-file release-notes.md `
              --prerelease
          } else {
            gh release create $env:RELEASE_TAG $asset.FullName `
              --target "${{ github.sha }}" `
              --title "electerm $env:APP_VERSION Private - Windows 10+ x64" `
              --notes-file release-notes.md `
              --prerelease
          }

          $legacyPrefix = "private-v$env:APP_VERSION-win10plus-r"
          $legacyTags = $releaseTags | Where-Object { $_.StartsWith($legacyPrefix) }
          foreach ($legacyTag in $legacyTags) {
            gh release delete $legacyTag --yes --cleanup-tag
          }

      - name: Record private release status
        if: always()
        shell: pwsh
        run: |
          $status = "${{ job.status }}"
          $payload = [ordered]@{
            status = $status
            runId = "${{ github.run_id }}"
            runNumber = "${{ github.run_number }}"
            sourceSha = "${{ github.sha }}"
            workflow = "${{ github.workflow }}"
            releaseTag = "private-v5.3.0-win10plus"
            updatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json
          $payload | Set-Content -Path PRIVATE_RELEASE_STATUS.json -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PRIVATE_RELEASE_STATUS.json
          git commit -m "ci: record private Windows release $status [skip ci]"
          if ($LASTEXITCODE -eq 0) {
            git fetch origin main_private
            git rebase origin/main_private
            git push origin HEAD:main_private
          }
