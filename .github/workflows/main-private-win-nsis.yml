# Windows-only private release pipeline for main_private.
# A pull request into main_private runs only the build job for diagnostics.
# A marked push to main_private runs build + private GitHub prerelease.

name: main-private-win-nsis

on:
  push:
    branches: [ main_private ]
  pull_request:
    branches: [ main_private ]

concurrency:
  group: main-private-win-nsis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows NSIS
    runs-on: windows-2022
    permissions:
      contents: read
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[private release]') && !contains(github.event.head_commit.message, '[skip build]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip win]') && !contains(github.event.head_commit.message, '[skip nsis]')) }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Use Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Configure npm
        run: npm config set legacy-peer-deps true

      - name: Install Yarn required by package preparation
        run: npm install -g yarn

      - name: Install project dependencies
        run: npm i

      - name: Build application assets
        run: npm run b

      - name: Prepare electron-builder config
        run: npm run pb

      - name: Build Windows x64 NSIS installer
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          WORKFLOW_NAME: private-windows
        run: node build/bin/build-win-nsis-private

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: electerm-private-windows-x64
          path: dist/*win-x64-installer.exe
          if-no-files-found: error

  release:
    name: Publish Private Release
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: electerm-private-windows-x64
          path: release-assets

      - name: Publish Windows-only prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $tag = "private-v$version-win10plus-r${{ github.run_number }}"
          $asset = Get-ChildItem -Path release-assets -Filter "*win-x64-installer.exe" | Select-Object -First 1

          if (-not $asset) {
            throw "Windows x64 NSIS installer not found in downloaded artifact"
          }

          gh release create $tag $asset.FullName `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "electerm $version Private - Windows 10+ x64" `
            --notes "Windows-only private build from main_private. Includes enterprise SSH/SFTP safety changes and disabled application update checks." `
            --prerelease
